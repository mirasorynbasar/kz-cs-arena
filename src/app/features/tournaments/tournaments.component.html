<div class="reg-container">
  <div class="reg-vertical-layout">
    
    <div class="hero-poster-section">
      <img src="/assets/kaznumajor.jpg" alt="KAZNU MAJOR 2026" class="main-poster-img">
      <div class="poster-overlay-gradient"></div>
      
      <div class="poster-text">
        <span class="status-pill">REGISTRATION OPEN</span>
        <h1 class="major-title">KAZNU MAJOR <span class="pink-text">2026</span></h1>
        <div class="prize-pool">PRIZE FUND: 1,000,000 ₸</div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-card">
        <div class="card-header">
          <h2>ОЙЫНШЫНЫ ТІРКЕУ</h2>
          <p>Турнирге қатысу үшін форманы толтырыңыз</p>
        </div>

        <form class="cyber-form">
          <div class="form-grid">
            <div class="input-box">
              <label>NICKNAME</label>
              <input type="text" placeholder="MirAs7" class="st-input">
            </div>

            <div class="input-box">
              <label>FACEIT NICKNAME</label>
              <div class="input-with-tag">
                <input type="text" placeholder="Faceit-тағы атыңыз" class="st-input">
                <span class="tag orange">FACEIT</span>
              </div>
            </div>

            <div class="input-box">
              <label>FACEIT ELO</label>
              <div class="input-with-tag">
                <input type="number" placeholder="2850" class="st-input">
                <span class="tag blue">⚡ ELO</span>
              </div>
            </div>

            <div class="input-box">
              <label>TEAM SELECT</label>
              <select class="st-input st-select">
                <option value="" disabled selected>Командаңызды таңдаңыз...</option>
                <option>Luxury Team</option>
                <option>Cyber Kings</option>
                <option>KAZNU Stars</option>
              </select>
            </div>
          </div>

          <button type="submit" class="mega-submit-btn">
            ТІРКЕЛУДІ РАСТАУ
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
