<div class="reg-container">
  <div class="reg-card">
    <div class="card-line top"></div>
    <div class="card-line bottom"></div>

    <div class="reg-header">
      <div class="live-dot"></div>
      <h2 class="neon-text-pink">Турнирге тіркелу</h2>
      <p class="reg-subtitle">Деректерді толтырып, элита қатарына қосылыңыз</p>
    </div>

    <form class="reg-form">
      <div class="input-group">
        <label><i class="icon-user"></i> Ойын никнеймі</label>
        <input type="text" placeholder="Мысалы: MirAs7" class="cyber-input">
      </div>

      <div class="input-group">
        <label><i class="icon-faceit"></i> Faceit Nickname</label>
        <div class="nickname-input-wrapper">
          <input type="text" placeholder="Faceit-тағы никнейміңіз" class="cyber-input nickname-field">
          <span class="faceit-tag">FACEIT</span>
        </div>
      </div>

      <div class="input-group">
        <label>Ағымдағы ELO</label>
        <div class="elo-input-wrapper">
          <input type="number" placeholder="2850" class="cyber-input elo-field">
          <span class="elo-badge">⚡ ELO</span>
        </div>
      </div>

      <div class="input-group">
        <label>Командаңыз</label>
        <div class="select-wrapper">
          <select class="cyber-input cyber-select">
            <option value="" disabled selected>Тізімнен таңдаңыз...</option>
            <option value="1">Luxury Team</option>
            <option value="2">Cyber Kings</option>
            <option value="3">KAZNU Stars</option>
            <option value="4">Free Agent (Командасыз)</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        <span class="btn-text">ТІРКЕУДІ АЯҚТАУ</span>
        <div class="btn-glitch"></div>
      </button>
    </form>
  </div>
</div>
